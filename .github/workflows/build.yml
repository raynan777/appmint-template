name: Build APK
on:
  workflow_dispatch:
    inputs:
      appName: { description: 'App Name', required: true, default: 'My App' }
      url: { description: 'Website URL', required: true, default: 'https://example.com' }
      packageId: { description: 'Package ID', required: true, default: 'com.appmint.myapp' }
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          echo "Building ${{ github.event.inputs.appName }} for ${{ github.event.inputs.url }}"
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: appmint-apk
          path: app/build/outputs/apk/debug/*.apk
